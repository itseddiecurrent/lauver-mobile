services:
  - type: web
    name: lauver-api-staging
    runtime: node
    rootDir: backend
    region: singapore
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: ./scripts/build-deploy.sh
    startCommand: npm run db:migrate:deploy && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: SHUTDOWN_TIMEOUT_MS
        value: 25000
      - key: AUTH_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: AUTH_ACCESS_TOKEN_TTL_SECONDS
        value: 900
      - key: AUTH_REFRESH_TOKEN_TTL_SECONDS
        value: 2592000
      - key: AUTH_PASSWORD_RESET_TTL_SECONDS
        value: 900
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: AUTH_RATE_LIMIT_MAX_ATTEMPTS
        value: 10
      - key: PASSWORD_RESET_DELIVERY
        value: disabled
      # After verifying a sender domain, add RESEND_API_KEY and
      # PASSWORD_RESET_FROM_EMAIL in Render, then change the mode to `resend`.
      - key: APPLE_AUTH_ENABLED
        value: false
      # Configure APPLE_CLIENT_ID, APPLE_TEAM_ID, APPLE_KEY_ID,
      # APPLE_PRIVATE_KEY, and APPLE_TOKEN_ENCRYPTION_KEY directly in Render,
      # then enable Apple auth. Never commit the p8 key.
      - key: PROFILE_PHOTO_STORAGE_ENABLED
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: false
      # Configure the object-storage endpoint, region, bucket, access-key ID,
      # secret access key, and public CDN/base URL directly in Render before
      # enabling profile photo storage.
      - key: DATABASE_URL
        fromDatabase:
          name: lauver-postgres-staging
          property: connectionString

databases:
  - name: lauver-postgres-staging
    databaseName: lauver_staging
    user: lauver
    region: singapore
    plan: free
    ipAllowList: []
