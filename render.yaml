services:
  - type: web
    name: lauver-api-staging
    runtime: node
    rootDir: backend
    region: singapore
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: ./scripts/build-deploy.sh
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: SHUTDOWN_TIMEOUT_MS
        value: 25000
      - key: DATABASE_URL
        fromDatabase:
          name: lauver-postgres-staging
          property: connectionString

databases:
  - name: lauver-postgres-staging
    databaseName: lauver_staging
    user: lauver
    region: singapore
    plan: free
    ipAllowList: []
