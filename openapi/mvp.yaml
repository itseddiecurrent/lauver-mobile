openapi: 3.1.0
info:
  title: Lauver MVP API
  version: 0.1.0
  description: Contract-first API for the native Lauver iOS MVP.
servers:
  - url: https://api-staging.lauver.ai
    description: Staging
  - url: https://api.lauver.ai
    description: Production
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness check
      security: []
      responses:
        '200':
          description: API process is running.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      operationId: getReadiness
      summary: API and PostgreSQL readiness check
      security: []
      responses:
        '200':
          description: API and PostgreSQL are ready to serve traffic.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: PostgreSQL is unavailable.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  headers:
    RequestId:
      description: Server-generated request correlation identifier.
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: lauver-api
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status, service, database]
      properties:
        status:
          type: string
          const: ready
        service:
          type: string
          const: lauver-api
        database:
          type: string
          const: ok
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
