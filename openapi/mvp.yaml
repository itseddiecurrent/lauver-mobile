openapi: 3.1.0
info:
  title: Lauver MVP API
  version: 0.1.0
  description: Contract-first API for the native Lauver iOS MVP.
servers:
  - url: https://api-staging.lauver.ai
    description: Staging
  - url: https://api.lauver.ai
    description: Production
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness check
      security: []
      responses:
        '200':
          description: API process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: lauver-api
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
