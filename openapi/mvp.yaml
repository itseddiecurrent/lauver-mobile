openapi: 3.1.0
info:
  title: Lauver MVP API
  version: 0.1.0
  description: Contract-first API for the native Lauver iOS MVP.
servers:
  - url: https://lauver-api-staging.onrender.com
    description: Staging
  - url: https://api.lauver.ai
    description: Production
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness check
      security: []
      responses:
        '200':
          description: API process is running.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      operationId: getReadiness
      summary: API and PostgreSQL readiness check
      security: []
      responses:
        '200':
          description: API and PostgreSQL are ready to serve traffic.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: PostgreSQL is unavailable.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/register:
    post:
      operationId: registerWithEmail
      summary: Register an email/password account and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailPasswordRequest'
      responses:
        '201':
          description: Account and session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '429':
          $ref: '#/components/responses/AuthError'
  /v1/auth/login:
    post:
      operationId: loginWithEmail
      summary: Create a session using email/password credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailPasswordRequest'
      responses:
        '200':
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '429':
          $ref: '#/components/responses/AuthError'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/AuthError'
  /v1/auth/apple:
    post:
      operationId: signInWithApple
      summary: Verify an Apple identity proof, exchange its one-time code, and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
      responses:
        '200':
          description: Authenticated Apple-backed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '429':
          $ref: '#/components/responses/AuthError'
        '503':
          $ref: '#/components/responses/AuthError'
  /v1/auth/google:
    post:
      operationId: signInWithGoogle
      summary: Verify a Firebase Google ID token and create a Lauver session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseGoogleRequest'
      responses:
        '200':
          description: Authenticated Google-backed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '429':
          $ref: '#/components/responses/AuthError'
        '503':
          $ref: '#/components/responses/AuthError'
  /v1/auth/logout:
    post:
      operationId: logoutSession
      summary: Revoke a refresh-token session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Session revoked or already absent.
  /v1/auth/password/forgot:
    post:
      operationId: requestPasswordReset
      summary: Request a generic password-reset delivery response
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
      responses:
        '202':
          description: Generic response for existing and non-existing accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/AuthError'
        '429':
          $ref: '#/components/responses/AuthError'
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Consume a single-use reset token and revoke existing sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 512
                password:
                  $ref: '#/components/schemas/Password'
      responses:
        '200':
          description: Password reset completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '429':
          $ref: '#/components/responses/AuthError'
  /v1/auth/session:
    get:
      operationId: restoreSession
      summary: Restore identity from a signed access token and active server session
      responses:
        '200':
          description: Verified current user.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/AuthError'
  /v1/me:
    get:
      operationId: getOwnProfile
      summary: Read the authenticated user's workout profile, including their selected city center
      responses:
        '200':
          description: Own profile, or an empty incomplete profile when it has not yet been edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProfileEnvelope'
        '401':
          $ref: '#/components/responses/AuthError'
    patch:
      operationId: updateOwnProfile
      summary: Update allowlisted workout profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile with server-derived pace units, brackets, and completeness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProfileEnvelope'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPublicProfile
      summary: Read a complete active user's public profile without city-center coordinates
      responses:
        '200':
          description: Public profile. City latitude, longitude, and storage object key are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfileEnvelope'
        '401':
          $ref: '#/components/responses/AuthError'
        '404':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /v1/me/photo/upload-url:
    post:
      operationId: createProfilePhotoUpload
      summary: Create a short-lived signed profile-photo PUT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
      responses:
        '201':
          description: User-scoped pending object key and signed upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUploadResponse'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '429':
          $ref: '#/components/responses/AuthError'
        '503':
          $ref: '#/components/responses/AuthError'
  /v1/me/photos/upload-urls:
    post:
      operationId: createProfilePhotoUploadBatch
      summary: Create up to nine short-lived signed profile-photo PUTs
      description: One request consumes one photo-batch rate-limit unit, regardless of the number of photos in the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoUploadBatchRequest'
      responses:
        '201':
          description: User-scoped pending object keys and signed upload URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUploadBatchResponse'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '429':
          description: Photo-batch rate limit exceeded.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/AuthError'
  /v1/me/photo/complete:
    post:
      operationId: completeProfilePhotoUpload
      description: Repeating completion for the currently saved upload returns the same profile, including after temporary upload cleanup. Deleted or replaced uploads remain invalid.
      summary: Validate uploaded bytes and make the new profile photo current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [objectKey]
              properties:
                objectKey:
                  type: string
                  maxLength: 512
      responses:
        '200':
          description: Updated own profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProfileEnvelope'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /v1/me/photo/cancel:
    post:
      operationId: cancelProfilePhotoUpload
      summary: Remove a pending profile-photo upload after a failed client upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [objectKey]
              properties:
                objectKey:
                  type: string
                  maxLength: 512
      responses:
        '204':
          description: The pending upload is removed; repeated cancellation is successful.
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /v1/me/photo:
    delete:
      operationId: deleteProfilePhoto
      summary: Remove the current profile photo and schedule its object for deletion
      responses:
        '204':
          description: Profile photo absent and cleanup scheduled or completed.
        '401':
          $ref: '#/components/responses/AuthError'
  /v1/discover:
    get:
      operationId: discoverUsers
      summary: Filter nearby workout profiles by city distance, sport and self-reported pace
      description: >-
        Requires a city in the caller's profile. Excludes the caller, incomplete,
        suspended, deleted and bidirectionally blocked users. Sorts by unrounded
        city-centre Haversine distance ascending, profile update time descending,
        then UUID ascending. Numeric pace bounds require a selected sport. With unchanged data,
        cursor pages have no duplicates or omissions. Changed profiles may move
        between pages; refresh starts a new traversal. Cursors are signed and bound
        to the caller, city and filters. Responses expose no coordinates.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sport
          schema:
            type: string
            enum: [running, trail_running, cycling, swimming, walking, hiking, rowing]
        - in: query
          name: radius
          description: City-centre radius in kilometres; unlimited removes the distance cap while preserving sorting and pagination.
          schema:
            type: string
            enum: ['5', '10', '20', '25', '30', '40', '50', '60', '70', '80', '90', '100', unlimited]
            default: '25'
        - in: query
          name: paceMin
          description: Inclusive lower bound in the selected sport's native pace unit (minutes/km, minutes/100m, minutes/500m, or km/h). Duration UI uses mm:ss and converts to decimal minutes. Requires sport; profiles without pace are excluded. May be omitted for an open lower end.
          schema:
            type: number
            exclusiveMinimum: 0
        - in: query
          name: paceMax
          description: Inclusive upper bound in the selected sport's native pace unit. Requires sport and must be at least paceMin when both are supplied. May be omitted for an open upper end. Bounds share six-decimal precision with stored profile paces.
          schema:
            type: number
            exclusiveMinimum: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 2048
      responses:
        '200':
          description: Deterministically ordered public profiles; Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverPage'
        '401':
          description: Session is invalid or expired.
        '422':
          description: Invalid query, missing caller city, or invalid/changed cursor context.
  /v1/blocks:
    get:
      operationId: listBlockedUsers
      summary: List only the authenticated user's outgoing blocks
      description: UUID-ordered pages of at most 50 entries; unavailable accounts have no display name or city. No coordinates are exposed.
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A private no-store page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedUsersPage'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /v1/blocks/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: blockUser
      summary: Idempotently block an active user
      description: Owner derives from the bearer session. Self-block returns 422. Both public Profile reads and Discover exclude either direction of a block. Body must be absent or empty.
      responses:
        '204':
          description: Block stored and request audit metadata recorded.
        '401':
          $ref: '#/components/responses/AuthError'
        '404':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '429':
          $ref: '#/components/responses/AuthError'
    delete:
      operationId: unblockUser
      summary: Idempotently remove only the caller's outgoing block
      description: Does not remove the other user's block or restore an old conversation.
      responses:
        '204':
          description: Outgoing block absent and audit metadata recorded.
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '429':
          $ref: '#/components/responses/AuthError'
  /v1/reports:
    post:
      operationId: reportUser
      summary: Submit Profile evidence to the review queue, optionally blocking the user atomically
      description: Step 07 supports user/profile targets only. Server captures immutable public profile text and sports, without coordinates, email or object keys. A repeat target creates a new report. Reporter identity and snapshots cannot be supplied by the client. No automatic block unless explicitly requested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserReportRequest'
      responses:
        '201':
          description: Evidence stored in the open queue; optional block and audit committed in one transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportReceipt'
        '401':
          $ref: '#/components/responses/AuthError'
        '404':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '429':
          $ref: '#/components/responses/AuthError'
  /v1/integrations/strava/start:
    post:
      operationId: startStravaConnection
      summary: Start a one-time account-bound read-only Strava authorization
      description: No user IDs or tokens accepted. Supersedes earlier pending attempts. Disconnect an existing connection first.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Ten-minute authorization flow. State is private and must not be logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StravaStart'
        '401': { $ref: '#/components/responses/AuthError' }
        '409':
          description: An existing connection or another integration operation must finish first.
        '422':
          description: Unexpected input.
        '429':
          description: Too many connection attempts.
        '503':
          description: Strava integration is disabled.
  /v1/integrations/strava/callback:
    get:
      operationId: finishStravaAuthorization
      summary: Fixed HTTPS provider callback; exchange and token storage happen on the server
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        - name: code
          in: query
          schema: { type: string, minLength: 1, maxLength: 2048 }
        - name: scope
          in: query
          description: Actual accepted scopes; both read and activity:read are required, with no additional scope.
          schema: { type: string, maxLength: 500 }
        - name: error
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '303':
          description: Return to lauver://oauth/strava with state and a non-sensitive result only. The App must re-read its authenticated status.
          headers:
            Location:
              schema: { type: string, format: uri }
        '400':
          description: Missing, malformed, expired, superseded or reused state. No redirect occurs.
        '401':
          description: The initiating account is no longer active.
        '409':
          description: Another integration operation is in progress.
        '429':
          description: Too many callback requests.
        '503':
          description: Strava integration is disabled.
  /v1/integrations/strava/status:
    get:
      operationId: getStravaConnection
      summary: Read only your connection and latest 20 activity summaries
      description: Cache-Control no-store. Provider credentials and precise locations are never returned. No account ID parameters accepted.
      responses:
        '200':
          description: Disabled, disconnected, connected, reconnect-required or pending-revocation status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StravaStatus'
        '401': { $ref: '#/components/responses/AuthError' }
        '409':
          description: Another integration operation is in progress.
        '422':
          description: Unexpected parameters.
  /v1/integrations/strava/sync:
    post:
      operationId: refreshStravaActivities
      summary: Refresh expired credentials and replace your recent summary window
      description: Idempotent per-user activity IDs. Always persist the newest refresh token before fetching activities. No caller-supplied account IDs or provider tokens accepted.
      responses:
        '200':
          description: Updated connected status and summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StravaStatus'
        '401': { $ref: '#/components/responses/AuthError' }
        '409':
          description: Disconnected, invalid authorization, changed scopes or concurrent integration request.
        '422':
          description: Unexpected input.
        '429':
          description: Lauver or Strava rate limit exceeded.
        '502':
          description: Strava temporarily unavailable; the latest credentials remain persisted.
        '503':
          description: Integration disabled.
  /v1/integrations/strava/disconnect:
    post:
      operationId: disconnectStrava
      summary: Clear summaries and revoke your refresh token with the recommended Strava endpoint
      description: Idempotent. Pending states are cancelled. Failed revocation remains durable and is retried each minute; pending is not a completed revocation.
      responses:
        '200':
          description: Disconnected after confirmed provider revocation, or revocation_pending after provider failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StravaStatus'
        '401': { $ref: '#/components/responses/AuthError' }
        '409':
          description: Another integration operation is in progress.
        '422':
          description: Unexpected input.
        '429':
          description: Too many disconnect attempts.
        '503':
          description: Integration disabled.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    AuthError:
      description: Authentication, validation, conflict, or rate-limit failure.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    RequestId:
      description: Server-generated request correlation identifier.
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Minimum number of seconds before retrying the photo batch.
      schema:
        type: integer
        minimum: 1
  schemas:
    StravaStart:
      type: object
      additionalProperties: false
      required: [authorizationURL, state, expiresIn]
      properties:
        authorizationURL:
          type: string
          format: uri
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        expiresIn:
          type: integer
          const: 600
    StravaStatus:
      type: object
      additionalProperties: false
      required: [status, athleteName, lastSyncedAt, scopes, activities]
      properties:
        status:
          type: string
          enum: [disabled, disconnected, connected, revocation_pending, reconnect_required]
        athleteName:
          type: [string, 'null']
        lastSyncedAt:
          type: [string, 'null']
          format: date-time
        scopes:
          type: array
          items: { type: string, enum: [read, 'activity:read'] }
        activities:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/StravaActivity'
    StravaActivity:
      type: object
      additionalProperties: false
      required: [id, title, sport, startedAt, durationSeconds, distanceMeters]
      properties:
        id: { type: string, pattern: '^[0-9]+$' }
        title: { type: string, maxLength: 500 }
        sport: { type: string, maxLength: 80 }
        startedAt: { type: string, format: date-time }
        durationSeconds: { type: integer, minimum: 0 }
        distanceMeters: { type: number, minimum: 0, maximum: 100000000 }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: lauver-api
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status, service, database]
      properties:
        status:
          type: string
          const: ready
        service:
          type: string
          const: lauver-api
        database:
          type: string
          const: ok
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        retryAfter:
          type: integer
          minimum: 1
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
    Password:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      pattern: '^(?=.*[A-Za-z])(?=.*[0-9]).+$'
    EmailPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          $ref: '#/components/schemas/Password'
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 512
    FirebaseGoogleRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          minLength: 1
          maxLength: 10000
    AppleSignInRequest:
      type: object
      additionalProperties: false
      required: [identityToken, authorizationCode, nonce, email, givenName, familyName]
      properties:
        identityToken:
          type: string
          minLength: 1
          maxLength: 10000
        authorizationCode:
          type: string
          minLength: 1
          maxLength: 2000
        nonce:
          type: string
          minLength: 32
          maxLength: 128
        email:
          type: [string, 'null']
          format: email
          maxLength: 320
          description: First-authorization value; the API accepts it only when it matches the verified token.
        givenName:
          type: [string, 'null']
          maxLength: 100
        familyName:
          type: [string, 'null']
          maxLength: 100
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    AuthSession:
      type: object
      additionalProperties: false
      required: [user, accessToken, refreshToken, expiresIn]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          minimum: 60
    MessageResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    ProfileCityInput:
      type: object
      additionalProperties: false
      required: [name, regionCode, countryCode, latitude, longitude]
      properties:
        name:
          type: string
          maxLength: 120
        regionCode:
          type: [string, 'null']
          maxLength: 16
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    PublicProfileCity:
      type: object
      additionalProperties: false
      required: [name, regionCode, countryCode]
      properties:
        name:
          type: string
        regionCode:
          type: [string, 'null']
        countryCode:
          type: string
    ProfileSportInput:
      type: object
      additionalProperties: false
      required: [sport, paceValue]
      properties:
        sport:
          type: string
          enum: [running, trail_running, cycling, swimming, walking, hiking, rowing]
        paceValue:
          type: [number, 'null']
          exclusiveMinimum: 0
    ProfileSport:
      type: object
      additionalProperties: false
      required: [sport, paceValue, paceUnit]
      properties:
        sport:
          type: string
          enum: [running, trail_running, cycling, swimming, walking, hiking, rowing]
        paceValue:
          type: [number, 'null']
        paceUnit:
          type: [string, 'null']
    TrainingTime:
      type: object
      additionalProperties: false
      required: [weekday, timeBucket]
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        timeBucket:
          type: string
          enum: [morning, midday, evening]
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: [string, 'null']
          maxLength: 80
        bio:
          type: [string, 'null']
          maxLength: 500
        city:
          oneOf:
            - $ref: '#/components/schemas/ProfileCityInput'
            - type: 'null'
        sports:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/ProfileSportInput'
        trainingTimes:
          type: array
          maxItems: 21
          items:
            $ref: '#/components/schemas/TrainingTime'
    OwnProfileEnvelope:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          $ref: '#/components/schemas/OwnProfile'
    PublicProfileEnvelope:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          $ref: '#/components/schemas/PublicProfile'
    OwnProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, bio, photoURL, city, sports, trainingTimes, isComplete]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: [string, 'null']
        bio:
          type: [string, 'null']
        photoURL:
          type: [string, 'null']
          format: uri
        city:
          oneOf:
            - $ref: '#/components/schemas/ProfileCityInput'
            - type: 'null'
        sports:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSport'
        trainingTimes:
          type: array
          items:
            $ref: '#/components/schemas/TrainingTime'
        isComplete:
          type: boolean
    PublicProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, bio, photoURL, city, sports, trainingTimes, isComplete]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: [string, 'null']
        bio:
          type: [string, 'null']
        photoURL:
          type: [string, 'null']
          format: uri
        city:
          oneOf:
            - $ref: '#/components/schemas/PublicProfileCity'
            - type: 'null'
        sports:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSport'
        trainingTimes:
          type: array
          items:
            $ref: '#/components/schemas/TrainingTime'
        isComplete:
          type: boolean
    PhotoUploadRequest:
      type: object
      additionalProperties: false
      required: [fileName, contentType, byteSize]
      properties:
        fileName:
          type: string
          maxLength: 255
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/heic, image/heif]
        byteSize:
          type: integer
          minimum: 1
          maximum: 5242880
    PhotoUploadBatchRequest:
      type: object
      additionalProperties: false
      required: [photos]
      properties:
        photos:
          type: array
          minItems: 1
          maxItems: 9
          items:
            allOf:
              - $ref: '#/components/schemas/PhotoUploadRequest'
              - type: object
                required: [clientID]
                properties:
                  clientID:
                    type: string
                    minLength: 1
                    maxLength: 80
    PhotoUploadBatchResponse:
      type: object
      additionalProperties: false
      required: [uploads]
      properties:
        uploads:
          type: array
          maxItems: 9
          items:
            allOf:
              - $ref: '#/components/schemas/PhotoUploadResponse'
              - type: object
                required: [clientID]
                properties:
                  clientID:
                    type: string
    PhotoUploadResponse:
      type: object
      additionalProperties: false
      required: [objectKey, uploadURL, expiresIn, requiredHeaders]
      properties:
        objectKey:
          type: string
        uploadURL:
          type: string
          format: uri
        expiresIn:
          type: integer
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
    BlockedUsersPage:
      type: object
      additionalProperties: false
      required: [users, nextCursor]
      properties:
        users:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [id, displayName, cityName]
            properties:
              id:
                type: string
                format: uuid
              displayName:
                type: [string, 'null']
              cityName:
                type: [string, 'null']
        nextCursor:
          type: [string, 'null']
          format: uuid
    UserReportRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, reason]
      properties:
        targetType:
          type: string
          const: user
        targetId:
          type: string
          format: uuid
        reason:
          type: string
          enum: [spam, harassment, hate_abuse, unsafe_event, impersonation, other]
        details:
          type: string
          maxLength: 2000
        blockUser:
          type: boolean
          default: false
    ReportReceipt:
      type: object
      additionalProperties: false
      required: [referenceId, blockedUser]
      properties:
        referenceId:
          type: string
          format: uuid
        blockedUser:
          type: boolean
    DiscoverUser:
      type: object
      additionalProperties: false
      required: [id, displayName, photoURL, city, approximateDistanceKm, sports, commonSports]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        photoURL:
          type: [string, 'null']
          format: uri
        city:
          $ref: '#/components/schemas/PublicProfileCity'
        approximateDistanceKm:
          type: integer
          minimum: 0
          description: Distance between city centres rounded to whole kilometres.
        sports:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSport'
        commonSports:
          type: array
          items:
            type: string
            enum: [running, trail_running, cycling, swimming, walking, hiking, rowing]
    DiscoverPage:
      type: object
      additionalProperties: false
      required: [users, nextCursor]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverUser'
        nextCursor:
          type: [string, 'null']
          description: Signed continuation cursor; null marks the last page.
security:
  - bearerAuth: []
