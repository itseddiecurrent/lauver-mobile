name: MVP CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install guardrail dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Test MVP scope checker
        run: ./scripts/tests/check-mvp-scope.test.sh
      - name: Check MVP scope
        run: ./scripts/check-mvp-scope.sh
      - name: Test secret checker
        run: ./scripts/tests/check-secrets.test.sh
      - name: Test iOS Simulator selection
        run: ./scripts/tests/select-ios-simulator.test.sh
      - name: Check Step 00 repository structure
        run: ./scripts/tests/check-step-00-structure.test.sh
      - name: Check Step 01 repository structure
        run: ./scripts/tests/check-step-01-structure.test.sh
      - name: Check Step 02 repository structure
        run: ./scripts/tests/check-step-02-structure.test.sh
      - name: Check Step 03 repository structure
        run: ./scripts/tests/check-step-03-structure.test.sh
      - name: Check Step 04 repository structure
        run: ./scripts/tests/check-step-04-structure.test.sh
      - name: Check working tree for secrets
        run: ./scripts/check-secrets.sh
      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@v2

  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://lauver:lauver_test@127.0.0.1:5432/lauver_test
      TEST_DATABASE_URL: postgresql://lauver:lauver_test@127.0.0.1:5432/lauver_test
      NODE_ENV: test
      LOG_LEVEL: silent
      AUTH_ACCESS_TOKEN_SECRET: ci-only-auth-secret-at-least-32-characters
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lauver
          POSTGRES_PASSWORD: lauver_test
          POSTGRES_DB: lauver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lauver -d lauver_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: docker build --tag lauver-api-step-01 .
      - run: npm audit --omit=dev

  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test native iOS app
        run: ./scripts/test-ios.sh
      - name: Verify built staging and production configuration
        run: ./scripts/test-ios-config.sh
